# =============================================================================
# fitapp core — настройки подключения и поведения
# Читает класс app.db.DatabaseConfig.
# ВАЖНО: в .properties нет строчных комментариев — только строки, начинающиеся с '#'
# =============================================================================

# ---------------------------- PostgreSQL 18 ----------------------------------
db.url=jdbc:postgresql://localhost:5432/fitapp?ApplicationName=fitapp
db.username=postgres
# Замените на свой пароль роли postgres ИЛИ задайте переменную окружения FITAPP_DB_PASSWORD
db.password=postgres
db.driver=org.postgresql.Driver

# ---------------------------- Hibernate 6 ------------------------------------
# Схему создаёт Flyway. hbm2ddl=none — Hibernate не трогает таблицы.
hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
hibernate.hbm2ddl.auto=none
hibernate.show_sql=false
hibernate.format_sql=true
hibernate.jdbc.batch_size=30
hibernate.jdbc.time_zone=UTC

# ---------------------------- Flyway -----------------------------------------
flyway.locations=classpath:db/migration
flyway.baselineOnMigrate=true

# ---------------------------- Пути приложения --------------------------------
# ${LOCALAPPDATA} подставляется DatabaseConfig при старте
app.data.dir=${LOCALAPPDATA}/fitapp
app.media.dir=${LOCALAPPDATA}/fitapp/media
app.logs.dir=${LOCALAPPDATA}/fitapp/logs
app.timezone=UTC

# ---------------------------- Значения по умолчанию для UI -------------------
app.default.theme=gray_blue
app.default.accentColor=#4F8EF7
app.singleUserMode=true

# ---------------------------- Логирование ------------------------------------
logging.level.root=WARN
logging.level.app=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.flywaydb=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %logger{36} - %msg%n
